name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * *"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-machete@0.8.0
      - name: Advisories, licences, bans, sources
        run: cargo deny check
      - name: No unused dependencies
        run: cargo machete
