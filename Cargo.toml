[package]
name = "charted-sea"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Unofficial async client for the Charted Sea scraping API: async runs, streaming results, polling with backoff, typed errors"
license = "MIT"
authors = ["Shola Ayeni"]
repository = "https://github.com/ayenisholah/charted-sea-rs"
documentation = "https://docs.rs/charted-sea"
readme = "README.md"
keywords = ["charted-sea", "scraping", "shopee", "lazada", "api-client"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
exclude = ["/.github", "/docs", "/tests/fixtures"]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
httpdate = "1.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "http2", "charset"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
